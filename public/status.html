<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Status · Tandoor House</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🩺%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">🩺</span><span>System status</span></a>
    <span class="spacer"></span>
    <span id="checked" class="muted num" style="font-size:.85rem"></span>
    <button id="refreshBtn" class="btn small" type="button">↻ Refresh</button>
    <button class="btn small ghost theme-btn" type="button" data-theme-toggle></button>
    <button id="lockBtn" class="btn small ghost" type="button">Lock</button>
  </header>

  <main class="mgr status-page">
    <section id="summary" class="status-summary" data-level="pending" aria-live="polite">
      <span class="status-icon" aria-hidden="true"></span>
      <div>
        <h1 id="summaryTitle">Checking…</h1>
        <p id="summaryText" class="muted">Asking the server, the database and every table.</p>
      </div>
    </section>

    <div class="kpis" id="kpis"></div>

    <div class="status-grid">
      <section class="panel">
        <div class="panel-head"><h2>Environment variables</h2><span class="muted small-note">values are never shown</span></div>
        <ul class="checks" id="settings"></ul>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Database</h2><span class="muted small-note" id="dbEngine"></span></div>
        <dl class="facts" id="database"></dl>
      </section>

      <section class="panel status-wide">
        <div class="panel-head"><h2>Tables in the database</h2><span class="muted small-note" id="tableNote"></span></div>
        <div class="table-scroll">
          <table class="data" id="tables">
            <thead><tr><th>Table</th><th class="right">Rows</th><th>Public API access</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Deployment</h2><span class="muted small-note" id="platform"></span></div>
        <dl class="facts" id="deployment"></dl>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Screens</h2><span class="muted small-note">open in a new tab</span></div>
        <ul class="checks" id="screens"></ul>
      </section>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/status.js"></script>
</body>
</html>
